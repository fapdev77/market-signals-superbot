name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Phase 2.5.7: before this workflow existed, a broken lockfile (missing cors/@types/cors) shipped and
# `npm ci` could not run at all. These jobs are the gate that would have caught it.
jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # package.json declares engines.node >= 20. Test the floor and the current LTS.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` is the reason this job exists: it fails loudly when the lockfile and package.json
      # disagree, which is exactly the failure that went unnoticed before.
      - name: Install (clean, lockfile-exact)
        run: npm ci

      # 7.0.2/CA-0.2: valida que os hashes do lock batem com o registry oficial.
      # É a checagem que teria barrado o lock corrompido antes do `npm ci` falhar.
      - name: Verify lock integrity against registry
        run: npm run verify:lock

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      # 6.8.5/CA-8.4: a contagem de `any` e de `catch` vazios não pode aumentar
      # em relação à baseline commitada (scripts/quality-baseline.json).
      - name: Quality baseline (no regression)
        run: npx tsx scripts/quality-baseline.ts

      - name: Build
        run: npm run build

  # 7.0.4/H-02: o Docker nunca era construído no CI. Este job constrói a imagem,
  # sobe o contêiner e espera o /api/health responder 200 (CA-0.4).
  docker:
    name: Docker image build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t superbot-ci .

      - name: Run container and wait for /api/health (200)
        run: |
          docker run -d --name superbot-ci -e API_AUTH_TOKEN=ci_token -p 3000:3000 superbot-ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            if [ "$code" = "200" ]; then echo "healthy after ${i} attempt(s)"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs superbot-ci; exit 1

      - name: Container logs (always)
        if: always()
        run: docker logs superbot-ci || true

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      # Only production dependencies gate the build. The 4 known moderate advisories come from
      # drizzle-kit's bundled esbuild dev server (devDependency, dev-only surface) and the only
      # offered fix is a downgrade of drizzle-kit, so they are tracked rather than forced.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
